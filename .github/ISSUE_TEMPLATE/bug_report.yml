name: Bug report
description: Something behaves incorrectly or a documented number does not reproduce.
labels: ["type:bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also state what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands, from a fresh clone, including Python version.
      value: |
        1. git clone ...
        2. python -m pip install "python-pptx>=1.0" "pytest>=8" "pytest-cov>=5"
        3. python -m pytest --cov --cov-branch
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit / release
      description: SHA or tag you saw the behavior on.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Paste the failing output (no screenshots of text).
