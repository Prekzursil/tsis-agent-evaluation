codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "100...100"
  status:
    project:
      default:
        target: 100%
        threshold: 0%
    patch:
      default:
        target: 100%
        threshold: 0%

comment:
  layout: "reach,diff,flags,files"

ignore:
  - ".github/**"
  - "tau2-bench/**"
  - "trail/**"
  - "mastscope/**"
  - "_audit/**"
  - "corpus/build_corpus.py"
  - "corpus/_probe.py"
